[package]
name        = "glob-nv"
version     = "0.1.1"
description = "Glob patterns over paths: `?`, `*`, `**`, character classes and ranges, matched against a candidate without allocating, plus a filesystem walker that expands one against a directory tree in a stable order."
license     = "Apache-2.0"
stability   = "experimental"
category    = "text"
layer       = "core"
host_modules = ["walk"]
tags        = ["glob", "fnmatch", "pattern", "wildcard", "path", "filesystem", "walk"]
repository  = "https://github.com/novolang/glob-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.7"

# A library: no `main`, so `novo pkg build` type-checks and effect-checks
# every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Matching and expanding glob patterns"

[dependencies]
# None, and the package keeps that promise: the matcher is a
# hand-written scan over bytes with no regular expression behind it, and
# the walker reads directories through `std.fs` and nothing else.
